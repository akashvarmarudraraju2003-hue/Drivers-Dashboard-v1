<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Driver Collection Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6ec;--red:#d64545;--grn:#1f9d63;--acc:#2f5bea}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141a;--card:#1b1e26;--tx:#e8eaf0;--mu:#8b93a3;--bd:#2b303b;--red:#ff6b6b;--grn:#3ecf8e;--acc:#6b8cff}}
:root[data-theme=dark]{--bg:#12141a;--card:#1b1e26;--tx:#e8eaf0;--mu:#8b93a3;--bd:#2b303b;--red:#ff6b6b;--grn:#3ecf8e;--acc:#6b8cff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0}.sub{color:var(--mu);font-size:12px;margin:2px 0 14px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.k .l{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.k .v{font-size:22px;font-weight:650;margin-top:2px}
.g{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin:10px 0}@media(max-width:760px){.g{grid-template-columns:1fr}}
h2{font-size:13px;margin:0 0 8px}.neg{color:var(--red)}.pos{color:var(--grn)}
.b{display:grid;grid-template-columns:90px 1fr 64px;gap:6px;align-items:center;font-size:12px;margin:4px 0}
.b i{display:block;height:10px;background:var(--red);border-radius:3px}.b span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}input{flex:1;min-width:140px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{cursor:pointer;color:var(--mu);font-size:11px;text-transform:uppercase;user-select:none}th:first-child,td:first-child{text-align:left}
.p{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--bd)}svg{width:100%;height:auto;display:block}
</style></head><body><div class="w">
<h1>Driver Collection Dashboard</h1><div class="sub" id="sub"></div>
<div class="k" id="k"></div>
<div class="g"><div class="c"><h2>Outstanding to collect over time</h2><div id="ch"></div></div>
<div class="c"><h2>Top 10 outstanding</h2><div id="top"></div></div></div>
<div class="c"><h2>Drivers</h2><div class="t"><input id="q" placeholder="Search driver or ID"><select id="f">
<option value="owe">Owes money</option><option value="inact">Owes &amp; inactive 7+ days</option><option value="pay">Payable to driver</option><option value="all">All drivers</option></select></div>
<div class="sc"><table><thead><tr id="h"></tr></thead><tbody id="tb"></tbody></table></div></div></div>
<script>
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(D=>{const R=D.rows,fm=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN'),$=i=>document.getElementById(i);
const owe=R.filter(r=>r[2]<0),pay=R.filter(r=>r[2]>0),sum=a=>a.reduce((s,r)=>s+r[2],0);
const ina=owe.filter(r=>r[5]>=7);
$('sub').textContent='Data through '+D.end+' · updated '+D.updated+' · '+R.length+' drivers · negative balance = driver owes company';
$('k').innerHTML=[['To collect',fm(-sum(owe)),'neg'],['Drivers owing',owe.length+' of '+R.length,''],['Inactive & owing (7d+)',fm(-sum(ina))+' · '+ina.length,'neg'],['Payable to drivers',fm(sum(pay)),'pos'],['Net position',fm(sum(R)),sum(R)<0?'neg':'pos']].map(a=>`<div class="c"><div class="l">${a[0]}</div><div class="v ${a[2]}">${a[1]}</div></div>`).join('');
const t=D.trend,mx=Math.max(...t.map(x=>x[1])),W=600,H=200,X=i=>10+i*(W-20)/(t.length-1),Y=v=>H-15-v/mx*(H-30);
$('ch').innerHTML=`<svg viewBox="0 0 ${W} ${H}"><path d="M${t.map((x,i)=>X(i)+','+Y(x[1])).join('L')}" fill="none" stroke="var(--red)" stroke-width="2"/><text x="10" y="12" font-size="11" fill="var(--mu)">Peak ${fm(mx)}</text><text x="10" y="${H-2}" font-size="10" fill="var(--mu)">${t[0][0]}</text><text x="${W-10}" y="${H-2}" font-size="10" text-anchor="end" fill="var(--mu)">${t[t.length-1][0]}</text></svg>`;
const top=[...owe].sort((a,b)=>a[2]-b[2]).slice(0,10),m0=-top[0][2];
$('top').innerHTML=top.map(r=>`<div class="b"><span>${r[1]}</span><span><i style="width:${-r[2]/m0*100}%"></i></span><span class="neg">${fm(r[2])}</span></div>`).join('');
const cols=[['Driver',1],['Balance',2],['Last 7d',3],['Last 30d',4],['Days inactive',5],['Paid in (cash+QR)',6],['Duty days',7]];let sk=2,sd=1;
$('h').innerHTML=cols.map(c=>`<th data-i="${c[1]}">${c[0]}</th>`).join('');
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;sd=sk==i?-sd:1;sk=i;draw()});
function draw(){const q=$('q').value.toLowerCase(),f=$('f').value;
let a=R.filter(r=>(f=='all'||(f=='owe'&&r[2]<0)||(f=='pay'&&r[2]>0)||(f=='inact'&&r[2]<0&&r[5]>=7))&&(r[1]+r[0]).toLowerCase().includes(q));
a.sort((x,y)=>(typeof x[sk]=='string'?x[sk].localeCompare(y[sk]):x[sk]-y[sk])*sd);
$('tb').innerHTML=a.map(r=>`<tr><td>${r[1]} <span style="color:var(--mu);font-size:11px">${r[0]}</span></td><td class="${r[2]<0?'neg':'pos'}">${fm(r[2])}</td><td class="${r[3]<0?'neg':''}">${fm(r[3])}</td><td class="${r[4]<0?'neg':''}">${fm(r[4])}</td><td>${r[5]==0?'<span class="p">active</span>':r[5]+'d'}</td><td>${fm(r[6])}</td><td>${r[7]}</td></tr>`).join('')||'<tr><td colspan="7">No drivers match</td></tr>'}
$('q').oninput=$('f').onchange=draw;draw();
}).catch(e=>{$('sub').textContent='Could not load data.json'});
</script></body></html>
